apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-iam-app
  namespace: default
  labels:
    app: springboot-iam-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: springboot-iam-app
  template:
    metadata:
      labels:
        app: springboot-iam-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: iam-microservice
          image: springboot-iam-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: springboot-iam-secrets
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: SPRING_PROFILES_ACTIVE
              value: "kafka"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka.default.svc.cluster.local:9092"
            - name: MANAGEMENT_ZIPKIN_TRACING_ENDPOINT
              value: "http://zipkin.default.svc.cluster.local:9411/api/v2/spans"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
---
apiVersion: v1
kind: Service
metadata:
  name: springboot-iam-service
  namespace: default
  labels:
    app: springboot-iam-app
spec:
  type: ClusterIP
  selector:
    app: springboot-iam-app
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
